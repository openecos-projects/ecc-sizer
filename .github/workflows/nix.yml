name: Nix

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x64-nix:
    name: Build Linux x64 (Nix)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use HTTPS for GitHub SSH submodule URLs
        # OpenROAD's .gitmodules points OpenSTA and abc at
        # ssh://git@github.com, and Nix recursively re-fetches submodules
        # itself, where the runner has no SSH key. Perform the same
        # conversion actions/checkout does for the top-level repo.
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.ani.llc/
            extra-trusted-public-keys = cache.ani.llc:8nINs8lCCU0Yoed1KMjLj6fCHpMmrY+sFuhGTdxLB88=

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build
        run: nix build --print-build-logs
