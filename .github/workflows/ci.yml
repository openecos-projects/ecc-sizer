name: CI

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x64:
    name: Build Linux x64
    uses: ./.github/workflows/build.yml
